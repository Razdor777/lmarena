struct SerializedSkin {
    // offset 0:   std::string SkinId
    // offset 32:  std::string PlayFabId  
    // offset 64:  std::string Unknown1
    // offset 96:  std::string Unknown2
    // offset 128: std::string SkinResourcePatch
    // offset 176: custom_buffer SkinData     // с кастомным аллокатором
    // offset 224: custom_buffer CapeData
    // offset 272: std::string SkinGeometryData (via sub_144C650B0)
    // offset 304: std::string SkinGeometryDataEngineVersion
    // offset 336: std::string SkinAnimationData
    // offset 368: std::string "0.0.0" (version, default)
    // offset 400: word[3] (resolution?)
    // offset 416: word SkinImageWidth
    // offset 424: word SkinImageHeight  // sub_141B1E240/E420
    // offset 432: std::string ArmSize
    // offset 464: std::string SkinColor
    // offset 496-504: PersonaPieces list (начало/конец)
    // offset 536-544: PieceTintColors linked list
    // offset 608: byte TrustedSkin status (==2 → trusted)
    // offset 609: byte PremiumSkin
    // offset 610: byte PersonaSkin
    // offset 611: byte CapeOnClassicSkin
    // offset 612: byte (EduMode specific, sub_141C0CAE0)
    // offset 613: byte OverrideSkin
    
    // Animated frames array:
    // offset 256-264: AnimatedImageData (begin/end pointers)
    // Каждый элемент: 16 * uint32 = 64 bytes
    //   [0]: Type
    //   [1]: AnimationExpression
    //   [3]: ImageWidth
    //   [4]: ImageHeight  
    //   [6-7]: image data ptr/size
    //   [14] as float: Frames count
    
    // Persona pieces: array of 96-byte structs
    //   +0:  PieceId (string)
    //   +32: PieceType enum (uint32)
    //   +40: PackId UUID (128-bit)
    //   +56: IsDefault (bool)
    //   +64: ProductId (string)
    
    // PieceTintColors: linked list nodes
    //   each node: +4*uint32 = PieceType enum
    //   +20 to +84: array of color strings (64 bytes, 4 entries of 16)
};
