Функция sub_141C49BA0 — LoginPacket Handler
C++

// Реальная сигнатура примерно такая:
void HandleLoginPacket(ServerNetworkHandler* handler, NetworkIdentifier& netId, LoginPacket& packet)
Логика обработки:

text

1. Проверка packet.id == 748 (LoginPacket ID)
   ├── packet.id < 748 → disconnect("disconnectionScreen.outdatedClient")
   └── packet.id > 748 → disconnect("disconnectionScreen.outdatedServer")

2. Если LoginPacket:
   ├── !packet.connectionRequest → disconnect с сообщением (packet 52)
   ├── Проверка времени (_time64) + JWT верификация (sub_141B23DE0)
   │   └── Fail → disconnect("disconnectionScreen.notAuthenticated")
   ├── Проверка цепочки сертификатов
   ├── sub_141B24320 → парсинг JWT identity chain
   ├── sub_143F3D480 → извлечение данных из chain
   └── Множество проверок...
Ключевые проверки:

Функция	Назначение
sub_141B23DE0	Верификация JWT цепочки (время + подпись)
sub_141B24320	Парсинг identity chain
sub_141B22C40	Проверка EduMode флага
sub_141B23740	Проверка PersonaSkin
sub_141C5C040	Проверка tenant (образовательный режим)
sub_142033230	Проверка IP ban / whitelist
sub_141B3ECC0	Получение encryption ключа
