Это стандартный ECDHE handshake Minecraft Bedrock с JWT.

Итоговая схема LoginPacket flow
text

Client → Server: LoginPacket (id=748)
    │
    ├── Версия неверная → Disconnect
    │
    ├── Валидация JWT chain (time + signature)
    │   └── Fail → Disconnect(notAuthenticated)
    │
    ├── Проверка multiplayer permissions (Xbox Live)
    │   └── Fail → Disconnect(multiplayerDisabled)  
    │
    ├── EduMode check (сравнение клиент vs сервер)
    │   └── Mismatch → Disconnect
    │
    ├── Edu tenant validation (если EduMode)
    │   └── Fail → Disconnect(invalidTenant)
    │
    ├── AllowList/BanList check
    │   └── Banned/NotAllowed → Disconnect(notAllowed)
    │
    ├── Skin validation (IsPersonaSkin + size check)
    │   └── Invalid → Disconnect(invalidSkin)
    │
    ├── Encryption handshake (ECDHE)
    │   ├── ServerToClientHandshake →
    │   └── StartEncryption
    │
    └── Player spawn / ResourcePacksInfo
Выводы
Packet ID 748 = LoginPacket в данной версии MCBE
Скин хранится как сериализованная структура ~650+ байт с множеством полей
Аутентификация через JWT chain (Xbox Live) с ECDHE шифрованием
Education Edition использует другие имена полей (SkinResources vs SkinResourcePatch)
Есть два пути: обычный login и transfer (разные валидаторы identity chain)

