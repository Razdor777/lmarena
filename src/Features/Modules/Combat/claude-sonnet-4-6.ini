sub_1409AEA40 (полная картина):
    = LoadSkinsFromSkinPack(geometrySystem, skinData)
    
    Логика:
    1. Дедупликация по UUID в списке (удаляет дубли)
    2. Определяет DeviceOS (Win32=8, iOS=2) → isEduCompatible
    3. Загружает "skins.json" через vtable[9](provider)
    4. Парсит JSON → проверяет тип (должен быть object)
    5. Получает localization_name → регистрирует в Locale
    6. Создаёт SkinPack объект (152 байта) через sub_1409A54B0
    7. Вызывает sub_1409A5EC0 для каждого SkinPack
    8. Итерирует json["skins"] массив:
       ├── Проверяет тип каждого элемента (должен быть object)
       ├── Читает: localization_name, texture, geometry, cape, type
       ├── Читает опционально: animations, enable_attachables,
       │                       held_item_ignores_lighting, hide_armor
       ├── Создаёт render definition (v269)
       ├── Обрабатывает geometry animations из SkinPack
       ├── Вызывает sub_142FC78B0 → SerializedSkin
       ├── Валидирует текстуру (vtable[7])
       ├── Валидирует cape (vtable[7])
       ├── При ошибке: LogWarning + пропускаем
       └── При успехе: sub_1409A5640 → добавляем в SkinPack
    9. Добавляем SkinPack в список (a1+240..248)
    
    Важные sub-функции:
    sub_1409A54B0  = InitSkinPack(ptr, skinData, locName, isEdu)
    sub_1409A5640  = AddSkinToSkinPack(skinPack, serializedSkin)
    sub_142FC78B0  = CreateSerializedSkin(out, skinId, locName, ...)
    sub_1409AE260  = ParseGeometryRef(out, jsonString)
    sub_140261D00  = LogError(...)
    sub_144BE1FB0  = LogWarning(level=3, cat=20, msg)

sub_14424FCD0 = RenderSkinGeometry(geoSystem, skinData, model, renderer)
    Рендерит геометрию скина:
    1. Инициализирует RenderBatch (через vtable sub_1442747B0)
    2. Вычисляет boneCount из vertex buffer размера
    3. Нормализатор = sub_144318480() * 0.039788734f (bone weight norm)
    4. Для каждой кости (stride 368 байт):
       ├── UV entry (16 байт, offset 1632+16*i)
       ├── BoneData (368 байт, offset boneBase+368*i)
       │   ├── +12: uint16 width
       │   ├── +14: uint16 height
       │   └── +88: UV mapping data
       ├── BoneTransform matrix (1288 байт, offset 856+1288*i)
       ├── sub_1442748C0 — процессирует геометрию
       ├── sub_144437680 — применяет UV mapping
       └── sub_144274AD0/B00 — применяет skin patches (persona)

