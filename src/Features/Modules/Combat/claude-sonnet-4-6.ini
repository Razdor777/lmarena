Функция sub_141641510 — SkinPatch Full Handler
C++

void HandleSkinPatchPacket(ServerNetworkHandler* handler, 
                           NetworkIdentifier netId, 
                           SkinPacket* packet)
Полный flow:

C++

// 1. Обновляет skin resource patch
sub_1416417B0(handler, packet)  // парсит новый patch

// 2. Применяет skin данные
sub_141641F50(handler, netId)   // основная логика выше

// 3. Очищает очередь загруженных ресурсов
while (resQueue.begin != resQueue.end) {
    free_string(entry->resourcePath)
    resQueue.begin += 5  // stride = 40 bytes
}

// 4. Определяет DeviceModel по OS:
// Использует FNV-1a хеш таблицу:
hash = 0xCBF29CE484222325 ^ deviceOS
for each byte: hash = hash * 0x100000001B3 ^ byte

// Поиск в хеш-таблице qword_146A283D8:
entry = table[hash & mask]
// Если найдено → строка модели устройства

// 5. Для каждого из 5 слотов (0..4):
for (int i = 0; i < 5; i++) {
    if (!platformService && (i >= 1 && i <= 3)) continue
    deviceString = getDeviceModelFromTable(i)
    // Добавляет в очередь загрузки ресурсов
    if (full) realloc(queue)
    else { *ptr = deviceString; queue.end += 40 }
}
Хеш-таблица DeviceOS → DeviceModel:
Это lookup table для определения модели устройства по OS ID (0=Unknown, 1=Android, 2=iOS, 3=OSX, 4=FireOS, 5=GearVR, 6=HoloLens, 7=Win10, 8=Win32, 9=Dedicated, 10=TVOS, 11=PlayStation, 12=Switch, 13=Xbox, 14=WindowsPhone, 19=Linux).

