sub_140DD4610(*handler)                // основная обработка

// 4. Вызываем коллбэки завершения
if (v18) (**v18)(v18, 1)   // completion callback
if (v20[0]) (***v20)(v20, 1) // cleanup callback
Это очередь задач для асинхронной обработки логина — Minecraft обрабатывает входящие подключения в отдельном потоке.

