Итоговый анализ: что делают эти функции
text

sub_140CAA5B0 = LoadSkinGeometryModel(cache, geometryData, json, w, h, mutex, reset)
    Загружает геометрию скина по имени:
    1. Берёт shared_ptr кэша атомарно
    2. Читает texture_width/texture_height из JSON "description"
    3. Создаёт GeometryModel (328 байт)
    4. Устанавливает preserve_model_pose
    5. Проверяет является ли геометрия встроенной (24 встроенных)
    6. Читает флаги анимации из JSON (10 флагов, bitmask в v51[0])
    7. Вычисляет FNV-1a хеш имени геометрии
    8. Кэширует GeometryModel под этим хешем (с мьютексом)

sub_140990A70 = ApplyGeometryToEntities(geometrySystem, skinData)
    Применяет геометрии скина к сущностям:
    1. Инициализирует ZoneInfo и GeometryContext
    2. Загружает дефолтную геометрию если нет кастомной (UUID: 1042557f...)
    3. 25 итераций по слотам геометрии (разные части модели)
    4. Для каждого слота проверяет: arm_size, body_size, side, zone, is_face
    5. Генерирует имена "skinId_N" для каждого рендер-слота
    6. Создаёт RenderDefinition с format_version и геометрией
    7. Для каждой entity в списке вызывает LoadSkinGeometryModel
Структура SkinGeometrySlot (элемент массива v5):
