// Если игрок НЕ TrustedSkin (offset +770):
if (!player->isTrustedSkin) {
    // Обычная обработка скина
    if (player->hasSkinData) {  // offset +45 от v9
        // Конвертирует и кодирует SkinData в base64
        sub_1444B25E0(&encoded, player->skinData)  
        sub_142D74D60(&decoded)
        
        // Устанавливает в JSON:
        json["SkinData"] = encoded
        json["SkinValue"] = json["SkinData"]  // alias
        json["SkinEntity"] = fullJson
    }
    
    // Формирует TrustedSkinInfo пакет
    json["playfabId"] = player->playfabId  // offset v9+4
    json["fullId"] = player->fullId        // offset v9+8
    
    // Отправляет "TrustedSkinInfo" событие
    sub_141687050(&v58)  // обработка TrustedSkinInfo
    
} else {
    // TrustedSkin - копирует данные напрямую
    // malloc + memcpy строки
    json["playfabId"] = copy(v9->playfabId)
    json["fullId"] = copy(v9->fullId)
}

// CapeData (если есть, offset +31 от v9):
if (player->hasCapeData) {
    encoded = base64(player->capeData)
    json["CapeData"] = encoded
}

// Применяет к игроку:
skin = json
handler->skinData = skin  // offset a1+120
