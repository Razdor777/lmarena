Механизм:

C++

// 1. Атомарно захватываем задачу из очереди
_InterlockedCompareExchange(refcount, old+1, old)

// 2. Получаем LoginPacket из очереди
v10 = sub_1403A88D0(handler, queue, &packet)

// 3. Запускаем обработку
