 🍄В случае блокировки или чего‑либо, деньги за донат не возвращаются.

 🍄Игрок должен в течение 3-х часов с момента выдачи наказания другому игроку, предоставить доказательства нарушения этого игрока в Telegram канал банов (mineore.org/playerban).

 🍄 Все доказательства действительны только те, которые были размещены в комментарии под постом бана, мута, кика игрока (mineore.org/playerban), то что вы скинули например их кому-то в ЛС или в общую беседу, не считается.

 🍄Время наказания игрока за его нарушение зависит от жесткости нарушения им. Например: игрок написал два матерных слова, мут на 5 минут или кик, игрок часто использует матерные слова, мут на 15-20 минут, и по такому принципу все остальные наказания за нарушение других правил сервера.

  🍄 Если нарушитель был наказан на меньшее время, и это время не превышает лимит времени которое указано в правилах сервера, то это не считается за пункт правил 4.2.

 🍄При муте/бане срок наказания нужно указывать в минутах, снизу будет список, сколько минут надо писать при нарушение какого-либо правила игроком:
1ч — 60 минут
